name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Export lockfile for one-time reproducible install bootstrap
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: node -e "const fs=require('node:fs');process.stdout.write('OPENVIBES_LOCKFILE_BASE64='+fs.readFileSync('package-lock.json').toString('base64')+'\\n')"
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Verify CLI entrypoint
        run: node dist/src/index.js --help
